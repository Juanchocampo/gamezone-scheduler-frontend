

<div
  class="flex flex-col justify-between min-h-screen bg-base-100 border-base-200 border-r text-base-content p-2"
>
  <div>
    <div class="p-2 border-base-200 border-b">
      <h1 class="text-sm font-bold flex flex-col gap-1">
        <div>
          Reserva
          <span class="text-primary">App</span>
          <div class="badge badge-sm badge-soft badge-error ml-2 rounded-2xl">Admin</div>
        </div>
        <span class="opacity-80 font-medium text-[.8rem]">Reservas Dashboard</span>
      </h1>
    </div>

    <nav class="flex flex-col gap-2 mt-8">
      <a
        routerLink="/dashboard/reservations"
        routerLinkActive="bg-neutral text-neutral-content"
        class="btn btn-ghost p-2 justify-start text-left"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 mr-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 7h18M3 12h18M3 17h18"
          />
        </svg>
        Reservas
      </a>
      <a
        routerLink="/home"
        routerLinkActive="bg-neutral text-neutral-content"
        class="btn btn-ghost p-2 justify-start text-left"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 mr-2"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875
                c0-.621.504-1.125 1.125-1.125h2.25
                c.621 0 1.125.504 1.125 1.125V21h4.125
                c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
          />
        </svg>
        Inicio
      </a>
    </nav>
  </div>

  <div class="flex flex-col gap-2">
    <div class="flex justify-start gap-3 items-center p-2">
      <label for="darkMode" class="flex justify-center items-center gap-1 cursor-pointer">
        <svg
          class="h-5 w-5 fill-current"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <path
            d="M21.64,13a1,1,0,0,0-1.05-.14,
            8.05,8.05,0,0,1-3.37.73A8.15,8.15,
            0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,
            1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,
            14.05,1,1,0,0,0,21.64,13Z"
          />
        </svg>
        <span class="text-[.8rem]"> Modo Oscuro </span>
      </label>
      <input
        type="checkbox"
        id="darkMode"
        class="toggle"
        [checked]="currentMode() === 'sunset'"
        (change)="toggleMode()"
      />
    </div>
    <a class="btn btn-ghost btn-error p-2 justify-start text-left" (click)="logout()">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M14 20H6C4.89543 20 4 19.1046
                 4 18L4 6C4 4.89543 4.89543 4 6 4H14M10
                 12H21M21 12L18 15M21 12L18 9"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Cerrar sesión
    </a>
  </div>
</div>
